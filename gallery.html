<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Primary SEO -->
  <title>Amir Hashmi | Gallery – Event Photos & Appearances</title>
  <meta name="description" content="Explore the official photo gallery of Amir Hashmi. Featuring events, concerts, book launches, Bolti Nadi initiatives, and National Award ceremonies.">
  <meta name="keywords" content="Amir Hashmi photos, gallery, events, concert images, Bolti Nadi photos, Johar Gandhi launch, Tiranga rally, Chhattisgarh">
  <meta name="author" content="Amir Hashmi">
  <meta name="robots" content="index, follow">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://amirhashmi.com/gallery.html">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <meta name="theme-color" content="#2563EB">
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .album-card {
      display: block;
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-2);
      border: 1px solid var(--border);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .album-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
    }
    .album-primary {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .album-card:hover .album-primary {
      transform: scale(1.05);
    }
    .album-info {
      padding: 16px;
    }
    .album-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.4;
      color: var(--text-1);
    }
    .album-meta {
      font-size: 0.85rem;
      color: var(--text-3);
      margin-top: 6px;
    }
    
    #scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 48px;
      height: 48px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      z-index: 99;
      box-shadow: 0 4px 12px rgba(212,175,55,0.3);
    }
    #scroll-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    #scroll-to-top:hover {
      background: #c39c2d;
    }
    
    .year-section { margin-bottom: 56px; }
    .year-header { font-family: var(--font-serif); font-size: 2rem; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 24px; }
    
    .news-toolbar {
      display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; align-items: flex-end;
    }
    .news-toolbar .search-wrap { flex: 1 1 260px; }
    .news-toolbar .form-select { min-width: 170px; }

    /* Full Page Viewer */
    #gallery-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #gallery-modal[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }
    .viewer-content {
      position: relative;
      width: 100%;
      height: calc(100vh - 100px); /* Leave room for thumbnails */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
    }
    .viewer-close {
      position: absolute;
      top: 20px;
      right: 30px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      z-index: 10000;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }
    .viewer-close:hover {
      color: var(--gold);
    }
    .viewer-prev, .viewer-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #fff;
      font-size: 50px;
      cursor: pointer;
      z-index: 10000;
      padding: 20px;
      transition: color 0.3s ease;
    }
    .viewer-prev {
      left: 10px;
    }
    .viewer-next {
      right: 10px;
    }
    .viewer-prev:hover, .viewer-next:hover {
      color: var(--gold);
    }
    .viewer-thumbnails-container {
      height: 100px;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .viewer-thumbnails {
      display: flex;
      gap: 12px;
      padding: 10px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;
    }
    .viewer-thumbnails::-webkit-scrollbar {
      display: none; /* Safari and Chrome */
    }
    .viewer-thumbnail {
      width: 60px;
      height: 60px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: opacity 0.3s ease, border-color 0.3s ease;
      flex-shrink: 0;
    }
    .viewer-thumbnail:hover {
      opacity: 0.8;
    }
    .viewer-thumbnail.active {
      opacity: 1;
      border-color: var(--gold);
    }

    /* Mobile (max-width: 768px) */
    @media (max-width: 768px) {
      .viewer-thumbnail {
        width: 40px;
        height: 40px;
      }
      .viewer-prev, .viewer-next {
        font-size: 36px;
        padding: 30px 15px;
      }
      .viewer-close {
        font-size: 32px;
        top: 15px;
        right: 20px;
      }
      .viewer-thumbnails {
        gap: 8px;
        padding: 10px 5px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
      }
      .viewer-content {
        height: calc(100vh - 80px);
      }
      .viewer-thumbnails-container {
        height: 80px;
      }
    }

    /* Tablet (max-width: 1024px) */
    @media (max-width: 1024px) and (min-width: 769px) {
      .viewer-thumbnail {
        width: 50px;
        height: 50px;
      }
      .viewer-prev, .viewer-next {
        font-size: 44px;
      }
    }
  </style>
</head>
<body>
<div id="ah-header-inject"></div>
<div id="progress-bar"></div>

<!-- ═══════════════════════════════════════════════════════
     HERO SECTION
═══════════════════════════════════════════════════════ -->
<section class="page-header">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep">&gt;</span>
      <span aria-current="page">Gallery</span>
    </nav>
    <h1 class="page-title">Gallery &amp; Events</h1>
    <p class="page-subtitle">A visual journey through concerts, public initiatives, youth workshops, and key milestones.</p>
  </div>
</section>

<!-- ═══════════════════════════════════════════════════════
     FEATURED EVENTS (Removed in favor of year-wise grouping)
═══════════════════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════════════════
     ALL EVENTS GALLERY
═══════════════════════════════════════════════════════ -->
<section class="section" style="background:var(--bg); padding-top: 40px;">
  <div class="container">
    <div class="section-header reveal">
      <h2 class="section-title">Complete Archive</h2>
    </div>

    <!-- Filters -->
    <div class="news-toolbar reveal">
      <div class="search-wrap">
        <label class="form-label" for="gallery-search">Search Events</label>
        <input type="search" id="gallery-search" class="search-input" placeholder="Search events..." autocomplete="off">
      </div>
      <div>
        <label class="form-label" for="gallery-year">Year</label>
        <select id="gallery-year" class="form-select" aria-label="Filter by year">
          <option value="">All years</option>
        </select>
      </div>
      <div>
        <label class="form-label" for="gallery-category">Category</label>
        <select id="gallery-category" class="form-select" aria-label="Filter by category">
          <option value="">All categories</option>
          <option value="Concert">Concert</option>
          <option value="Workshop">Workshop</option>
          <option value="Guest Appearance">Guest Appearance</option>
          <option value="Award">Award</option>
          <option value="Initiative">Initiative</option>
          <option value="Book Launch">Book Launch</option>
        </select>
      </div>
    </div>

    <div id="gallery-skeleton-all" class="grid-3" aria-hidden="true" style="margin-top:24px;">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <div id="gallery-empty" class="empty-state" hidden>
      No events found matching your criteria.
    </div>

    <div id="all-gallery-container" role="list"></div>
  </div>
</section>

<!-- ═══════════════════════════════════════════════════════
     LIGHTBOX MODAL
═══════════════════════════════════════════════════════ -->
<div id="gallery-modal" aria-hidden="true" role="dialog">
  <button class="viewer-close" id="gallery-modal-close" aria-label="Close modal">&times;</button>
  
  <div class="viewer-content" id="viewer-container">
    <img id="lightbox-img" src="" alt="Event Image">
    
    <button id="lightbox-prev" class="viewer-prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1em;height:1em;"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="lightbox-next" class="viewer-next" aria-label="Next image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1em;height:1em;"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  
  <div class="viewer-thumbnails-container">
    <div class="viewer-thumbnails" id="viewer-thumbnails">
      <!-- Thumbnails injected by JS -->
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="assets/js/core.js"></script>
<script src="assets/js/gallery.js"></script>
<script src="assets/js/components.js"></script>
<div id="ah-footer-inject"></div>

<button id="scroll-to-top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px;"><polyline points="18 15 12 9 6 15"/></svg>
</button>

</body>
</html>
