  <style>
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
    .video-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-xl);
      overflow: hidden; box-shadow: var(--sh-sm); transition: var(--t);
    }
    .video-card:hover { box-shadow: var(--sh-lg); border-color: rgba(37,99,235,0.15); transform: translateY(-3px); }
    .video-card h3 { padding: 16px 18px 8px; font-size: 1rem; font-family: var(--font-serif); font-weight: 700; }
    .ratio { position: relative; padding-bottom: 56.25%; height: 0; background: var(--navy); }
    .ratio iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
