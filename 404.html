<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Amir Hashmi</title>
  <meta name="robots" content="noindex, follow">
  <style>
    /* Same design system as main site */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a2a;
      font-family: 'Inter', sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .error-container {
      max-width: 600px;
    }
    h1 {
      font-size: 120px;
      margin: 0;
      font-family: 'Cinzel', serif;
      color: #d4af37;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    p {
      color: #ccc;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #d4af37;
      color: #0a0a2a;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      margin: 0 10px;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #d4af37;
      color: #d4af37;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you are looking for does not exist or has been moved.</p>
    <div>
      <a href="/" class="btn">Go Home</a>
      <a href="/chronicle.html" class="btn btn-outline">Read Chronicle</a>
    </div>
  </div>
</body>
</html>
